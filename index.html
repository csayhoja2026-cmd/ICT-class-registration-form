<!DOCTYPE html>
<html>
<head>


    <title>Computer class registration form</title>
</head>
<body>

    <h1>Computer class registration form</h1>

    <p>Please fill in the form below to register for computer classes</p>
    <form>

        <h2>Personal information</h2>

        <label> Full Name:</label>
        <input type="text" name="full name " placeholder="Enter your full name">
        <br><br>

        <label>Date of birth:</label>

        <input type="date" name="dob">

        <br><br>

        <label>Gender:</label>

        <input type="radio" id="male" name="Gender" value="male">
        <label for="male">male</label>



        <input type="radio" id="female" name="Gender" value="female">
        <label for="female">male</label>

         <label for="Natioanality" >Nationality:</label>

        <input type="text" id="Nationality" name="Nationality" >
        <br><br>

        <h2>Contact information</h2>
        <label for="phone">phone number:</label>

        <input type="tel" id="Phone" name="Phone" placeholder="Enter Phone number">

        <br><br>

        <label for="Email">Email Address:</label>

        <input type="email" id="email"  name="email" placeholder="Enter email address" >
        <br><br>    
        
        <label for="address">Address:</label>
        <br>

        <textarea id="address" name="address" rows="4" cols="40"></textarea>
        <br><br>

        <h2>Computer class information</h2>
        <label for="level">choose ICT level:</label>

        <select id="level" name="level">
            <option value="">--select level --</option>

            <option value="certificate">Certificate</option>

            <option value="Diploma">Diploma</option>

            <option value="Advance Diploma">Advance Diploma</option>


        </select>

        <br><br>
        <label>preferred class time:</label>
        <input type="radio" id="Morning" name="time" value="Morning">

        <label for="Morning">Morning</label>

        <input type="radio" id="Afternoon" name="time" value="Afternoon">
        <label for="Afternoon">Afternoon</label>

        <input type="radio" id="Evening" name="time" value="Evening">
        <label for="Evening">Afternoon</label>

        <br><br>
        <label for="Experience">Previous ICT Experience:</label>
        <br>

        <textarea id="Experience" name="Experience" rows="5" cols="50" placeholder="Describe your previous ICT Experience"></textarea>

        <br><br>

        <h2>Additional information</h2>
        <label for="reason">Why you want to study ICT?</label>
        <br>
        <textarea id="reason" name="reason" rows="5" cols="50" placeholder="Enter your reason"></textarea>
        <br><br>

        <input type="checkbox" id="terms" name="terms">

        <label for="terms">I agree to the ICT class registration terms and conditions</label>

        <br><br>

        <input type="submit" value="Register">

        <input type="reset" value="clear form">





        
    </form>
</body>






</html>
